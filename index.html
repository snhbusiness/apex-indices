<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0C10" />
<link rel="manifest" href="manifest.webmanifest" />
<title>APEX · indices — terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --bg:#0A0C10; --bg2:#0E1117; --panel:#12161D; --panel2:#171C24;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --tx:#E6E8EC; --mut:#8A909C; --dim:#565C68;
  --gold:#E9B23A; --gold-d:#7a5e18;
  --up:#3DD68C; --down:#F2555A; --teal:#4FD1C5; --pur:#A99BF5; --amb:#E6A33E; --blue:#5AA9F0;
  --r:6px; --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--tx); font-family:var(--sans); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 700px at 80% -10%, rgba(233,178,58,.05), transparent 60%);
}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .gold{color:var(--gold)}
button{font-family:inherit;cursor:pointer;color:inherit}
a{color:var(--gold);text-decoration:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#222833;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{
  background:linear-gradient(180deg,var(--bg2),var(--bg));
  border-right:1px solid var(--line); padding:18px 12px; position:sticky;top:0;height:100vh;overflow:auto;
}
.brand{display:flex;align-items:baseline;gap:8px;padding:6px 8px 16px}
.brand b{font-family:var(--mono);font-weight:600;letter-spacing:.28em;font-size:16px}
.brand span{color:var(--gold);font-family:var(--mono);font-size:11px;letter-spacing:.2em}
.navgrp{margin:14px 0 4px;padding:0 8px;color:var(--dim);font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:9px;width:100%;background:none;border:0;text-align:left;
  padding:8px 10px;border-radius:var(--r);color:var(--mut);font-size:13px;transition:.12s}
.nav:hover{background:var(--panel);color:var(--tx)}
.nav.on{background:var(--panel2);color:var(--tx);box-shadow:inset 2px 0 0 var(--gold)}
.nav i{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5;flex:0 0 auto}
.nav.on i{background:var(--gold);opacity:1}
.nav .tag{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--gold-d);border:1px solid var(--gold-d);
  border-radius:3px;padding:0 4px;letter-spacing:.05em}

/* ---- topbar ---- */
.main{display:flex;flex-direction:column;min-width:0}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:11px 22px;background:rgba(10,12,16,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.clock{font-family:var(--mono);font-size:13px;letter-spacing:.04em}
.clock .lab{color:var(--dim);font-size:10px;letter-spacing:.14em;margin-right:5px}
.sessions{display:flex;gap:6px}
.sess{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--mut);
  border:1px solid var(--line);border-radius:20px;padding:3px 9px}
.sess .d{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sess.open .d{background:var(--up);box-shadow:0 0 8px var(--up)}
.sess.open{color:var(--tx)}
.regime{margin-left:auto;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;
  border:1px solid var(--line2);border-radius:20px;padding:4px 12px}
.regime .dot{width:8px;height:8px;border-radius:50%}
.gear{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:7px 11px;color:var(--mut)}
.gear:hover{color:var(--tx);border-color:var(--line2)}

/* ---- content ---- */
.wrap{padding:24px 22px 60px;max-width:1180px;width:100%}
.h1{font-size:13px;letter-spacing:.05em}
.h1 b{font-weight:600;font-size:22px;letter-spacing:-.01em;display:block;margin-top:2px}
.h1 b em{font-style:normal;color:var(--gold)}
.sub{color:var(--mut);font-size:13px;margin:6px 0 22px;max-width:620px}

.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;
  animation:rise .5s both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card .k{color:var(--dim);font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
.tile{display:flex;flex-direction:column;gap:3px}
.tile .sym{font-family:var(--mono);font-size:12px;color:var(--mut);letter-spacing:.05em}
.tile .val{font-family:var(--mono);font-size:24px;font-weight:500;letter-spacing:-.01em}
.tile .lvl{font-family:var(--mono);font-size:13px;color:var(--mut);margin-top:2px}
.tile.clk{cursor:pointer;transition:.12s}
.tile.clk:hover{border-color:var(--gold);transform:translateY(-1px)}
.tile .go{color:var(--dim);font-size:11px}
.meteo{border-radius:12px;padding:16px 18px;margin-bottom:10px}
.meteo-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.meteo-lab{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.meteo-word{font-family:var(--mono);font-weight:600;letter-spacing:.08em;font-size:18px;margin-top:3px}
.meteo-num{font-family:var(--mono);font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.meteo-track{height:7px;border-radius:4px;margin-top:12px;overflow:hidden}
.meteo-sub{font-family:var(--mono);font-size:10.5px;margin-top:8px;letter-spacing:.03em}
.tile .chg{font-family:var(--mono);font-size:13px}
.section-h{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.section-h h3{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);font-weight:600}
.section-h .ln{flex:1;height:1px;background:var(--line)}

/* regime barometer */
.baro{display:flex;flex-wrap:wrap;gap:22px;align-items:center}
.metric{display:flex;flex-direction:column;gap:2px}
.metric .v{font-family:var(--mono);font-size:18px;font-weight:500}
.metric .l{color:var(--dim);font-size:11px;font-family:var(--mono);letter-spacing:.05em}
.scorebar{flex:1;min-width:180px;height:8px;border-radius:5px;background:linear-gradient(90deg,var(--down),#caa23e,var(--up));position:relative}
.scorebar .pin{position:absolute;top:-4px;width:3px;height:16px;background:#fff;border-radius:2px;transform:translateX(-50%);transition:.6s}

/* buttons */
.btn{background:var(--gold);color:#1a1407;border:0;border-radius:var(--r);padding:10px 16px;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;gap:8px;transition:.12s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--panel2);color:var(--tx);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--gold)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* brief */
.brief-body{white-space:pre-wrap;line-height:1.7}
.brief-sec{border-top:1px solid var(--line);padding:14px 0}
.brief-sec:first-child{border:0;padding-top:0}
.brief-sec .lab{color:var(--gold);font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px}
.verdict{font-size:17px;line-height:1.5;font-weight:500}
.factbar{display:flex;flex-wrap:wrap;gap:14px 26px;padding:14px 16px;background:var(--bg2);border:1px solid var(--line);
  border-radius:8px;margin-top:8px}
.factbar .f{display:flex;flex-direction:column}
.factbar .f .l{color:var(--dim);font-size:10px;font-family:var(--mono);letter-spacing:.08em}
.factbar .f .v{font-family:var(--mono);font-size:15px}

/* catalysts */
.cat{border:1px solid var(--line);border-radius:10px;margin-bottom:12px;overflow:hidden;background:var(--panel);animation:rise .5s both}
.cat .head{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;cursor:pointer}
.cat .conv{font-family:var(--mono);font-size:11px;border-radius:5px;padding:3px 7px;flex:0 0 auto;align-self:center}
.cat .ttl{font-weight:600;font-size:15px}
.cat .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.04em;border:1px solid var(--line2);color:var(--mut);
  border-radius:20px;padding:2px 9px;text-transform:uppercase}
.pill.h{color:var(--down);border-color:#5a2a2c} .pill.s{color:var(--blue);border-color:#27425e}
.pill.t{color:var(--teal);border-color:#1f4a45}
.cat .body{padding:0 16px 16px;display:none}
.cat.open .body{display:block}
.cat .chev{margin-left:auto;color:var(--dim);font-family:var(--mono);align-self:center}
.chain{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.node{font-family:var(--mono);font-size:12px;border:1px solid var(--line2);border-radius:6px;padding:5px 9px;background:var(--bg2)}
.node.pos{color:var(--up);border-color:#1f4a36} .node.neg{color:var(--down);border-color:#5a2a2c}
.kv{display:grid;grid-template-columns:120px 1fr;gap:6px 14px;margin:4px 0}
.kv .k2{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding-top:1px}
.scn{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:8px}
.scn .b{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--bg2)}
.scn .b .t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.scn .b.bull .t{color:var(--up)} .scn .b.bear .t{color:var(--down)} .scn .b.base .t{color:var(--mut)} .scn .b.inval .t{color:var(--amb)}

/* settings */
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;margin-bottom:5px}
.field .hint{color:var(--mut);font-size:12px;margin-bottom:7px}
.field input,.field select{width:100%;background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r);
  padding:9px 11px;color:var(--tx);font-family:var(--mono);font-size:13px}
.field input:focus,.field select:focus{outline:0;border-color:var(--gold)}
.status{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:4px;margin-left:8px}
.status.ok{color:var(--up);background:rgba(61,214,140,.1)}
.status.no{color:var(--dim);background:rgba(255,255,255,.04)}

.empty{color:var(--mut);text-align:center;padding:40px 20px;border:1px dashed var(--line2);border-radius:10px}
.banner{background:rgba(233,178,58,.08);border:1px solid var(--gold-d);border-radius:8px;padding:11px 14px;
  font-size:12.5px;color:#e9d3a0;margin-bottom:18px}
.spin{width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#1a1407;border-radius:50%;
  animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.tv{height:46px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:4px}

/* mobile */
.menubtn{display:none}
@media(max-width:880px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;z-index:50;width:240px;transform:translateX(-100%);transition:.25s}
  .side.show{transform:none}
  .menubtn{display:inline-flex}
  .g3,.g4{grid-template-columns:repeat(2,1fr)}
  .scn{grid-template-columns:1fr}
  .wrap{padding:18px 14px 60px}
  .regime{margin-left:0}
}
@media(max-width:520px){.g3,.g4,.g2{grid-template-columns:1fr}}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.scrim.show{display:block}
</style>
</head>
<body>
<div class="app">
  <!-- SIDEBAR -->
  <aside class="side" id="side">
    <div class="brand"><b>APEX</b><span>indices</span></div>
    <div class="navgrp">Marché</div>
    <button class="nav on" data-v="overview"><i></i>Vue d'ensemble</button>
    <button class="nav" data-v="brief"><i></i>Morning brief</button>
    <button class="nav" data-v="catalysts"><i></i>Catalyseurs <span class="tag">IA</span></button>
    <div class="navgrp">Données</div>
    <button class="nav" data-v="calendar"><i></i>Calendrier</button>
    <button class="nav" data-v="breadth"><i></i>Breadth</button>
    <button class="nav" data-v="sectors"><i></i>Secteurs</button>
    <div class="navgrp">Desk</div>
    <button class="nav" data-v="journal"><i></i>Journal</button>
    <button class="nav" data-v="settings"><i></i>Paramètres</button>
    <div style="margin-top:24px;padding:0 8px;color:var(--dim);font-family:var(--mono);font-size:10px;line-height:1.7">
      v1.8 · indices build<br>brief 2-couches · catalyseurs IA<br>données locales · navigateur
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- MAIN -->
  <div class="main">
    <header class="top">
      <button class="gear menubtn" id="menubtn">≡</button>
      <div class="clock"><span class="lab">PARIS</span><span id="cParis">--:--</span></div>
      <div class="clock"><span class="lab">UTC</span><span id="cUtc">--:--</span></div>
      <div class="sessions" id="sessions"></div>
      <div class="regime" id="regimeBadge"><span class="dot" style="background:var(--dim)"></span><span>régime —</span></div>
      <button class="gear" data-v="settings">⚙</button>
    </header>
    <div class="wrap" id="view"></div>
  </div>
</div>

<script>
/* ============================================================
   APEX · indices — terminal mono-fichier
   Architecture : couche factuelle (déterministe) + couche
   narrative (IA). Données + clés en localStorage.
   ============================================================ */
const $=(s,r=document)=>r.querySelector(s);
const fmt=(n,d=2)=>n==null||isNaN(n)?'—':Number(n).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sign=n=>n==null?'':(n>=0?'+':'');

/* ---------- CONFIG (localStorage) ---------- */
const CFG={
  get:k=>localStorage.getItem('apexidx_'+k)||'',
  set:(k,v)=>localStorage.setItem('apexidx_'+k,v),
  keys:()=>({anthropic:CFG.get('k_anthropic'),fmp:CFG.get('k_fmp'),finnhub:CFG.get('k_finnhub'),
            fred:CFG.get('k_fred'),twelve:CFG.get('k_twelve')}),
  model:()=>CFG.get('model')||'claude-sonnet-4-6'
};

/* ---------- STRUCTURE : base de référence injectée à l'IA ----------
   Poids indices + graphe pairs (fournisseur / concurrent / secteur).
   À enrichir : c'est ce qui empêche l'IA de halluciner les relations. */
const STRUCTURE={
  indices:{
    CAC40:{top:{LVMH:'~11%',Airbus:'~7%','TotalEnergies':'~7%',Schneider:'~6%','Sanofi':'~5%','L\'Oréal':'~5%'}},
    SX5E:{note:'Euro Stoxx 50 — large cap zone euro'},
    SPX:{top:{'Apple':'~7%','Microsoft':'~7%','Nvidia':'~6%','Amazon':'~4%','Meta':'~2.5%'},note:'concentration Mag7 dominante'},
    NDX:{note:'Nasdaq 100 — tech lourd, sensible aux taux réels'}
  },
  peers:{
    Airbus:{fournisseurs:['Safran','MTU Aero'],concurrents:['Boeing'],secteur:'Aéronautique & Défense',indices:['CAC40','SX5E']},
    'Pernod Ricard':{concurrents:['Diageo','Campari','Rémy Cointreau'],secteur:'Spiritueux',indices:['CAC40'],theme:'pression santé / GLP-1 / sans-alcool'},
    LVMH:{concurrents:['Kering','Hermès','Richemont'],secteur:'Luxe',indices:['CAC40','SX5E']},
    TotalEnergies:{secteur:'Énergie',drivers:['Brent','WTI'],indices:['CAC40','SX5E']},
    Nvidia:{fournisseurs:['TSMC','SK Hynix'],concurrents:['AMD'],clients:['Microsoft','Meta','Amazon'],secteur:'Semis IA',indices:['SPX','NDX']}
  },
  liquidity_playbook:{
    'M&A':'cible gap vers prix d\'offre (spread arbitrage), acquéreur baisse souvent, reweighting indiciel si taille change, desks merger-arb actifs',
    contract:'souvent move 1 jour puis fade sauf si guidance modifiée',
    policy:'re-rating lent sur semaines, lecture thématique sectorielle',
    earnings:'gamma/pinning options autour des strikes, vol implicite élevée avant',
    macro:'mouvement large multi-actifs, flux directionnels indices/taux',
    geopolitical:'flight-to-quality possible, énergie + défense réactifs'
  }
};

/* ---------- DATA LAYER : tout vient du proxy (vraies données ou rien) ---------- */
async function jget(url,opt){const r=await fetch(url,opt);if(!r.ok)throw new Error(r.status);return r.json();}

async function buildMarketState(){
  const proxy=CFG.get('proxy').replace(/\/$/,'');
  if(!proxy) return {error:'no-proxy'};
  try{
    const st=await jget(proxy+'/api/market_state');
    st.regime=st.regime||{}; st.overnight=st.overnight||{us_close:[],asia:[],futures:[]};
    st.backdrop=st.backdrop||{}; st.calendar_today=st.calendar_today||[]; st.earnings_today=st.earnings_today||[];
    return st;
  }catch(e){ return {error:e.message||'fetch'}; }
}

/* ---------- SECTEURS & BREADTH (données fournies par le proxy) ---------- */
let SB=null; // cache module
async function fetchSectorBreadth(){
  const proxy=CFG.get('proxy').replace(/\/$/,'');
  if(!proxy) return {error:'no-proxy'};
  try{ return await jget(proxy+'/api/sector_breadth'); }
  catch(e){ return {error:e.message||'fetch'}; }
}
/* verdict breadth déterministe */
function breadthVerdict(sb){
  let narrow=0,wide=0;
  if(sb.rsp!=null&&sb.spy!=null){(sb.rsp<sb.spy)?narrow++:wide++;}
  if(sb.iwm!=null&&sb.spy!=null){(sb.iwm<sb.spy)?narrow++:wide++;}
  const green=sb.sectors.filter(s=>s.chg>0).length, tot=sb.sectors.length;
  (green>=tot*0.6)?wide++:(green<=tot*0.4?narrow++:0);
  if(sb.mag7!=null&&sb.spy!=null&&sb.mag7>sb.spy+0.3)narrow++;
  if(narrow>wide) return {label:'étroite',cls:'down',txt:`Marché porté par peu de valeurs (méga-caps). ${green}/${tot} secteurs en hausse, équipondéré en retard. Hausse fragile.`};
  if(wide>narrow) return {label:'saine / large',cls:'up',txt:`Participation large. ${green}/${tot} secteurs en hausse, équipondéré et small caps suivent. Mouvement solide.`};
  return {label:'mitigée',cls:'',txt:`Signaux contrastés. ${green}/${tot} secteurs en hausse. Pas de tendance de breadth nette.`};
}
function riskRotation(sb){
  const avg=g=>{const a=sb.sectors.filter(s=>s.grp===g).map(s=>s.chg);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0;};
  const offcyc=(avg('off')+avg('cyc'))/2, def=avg('def');
  if(offcyc>def+0.15) return {label:'risk-on',cls:'up',txt:'cycliques/offensifs devant les défensifs'};
  if(def>offcyc+0.15) return {label:'risk-off',cls:'down',txt:'défensifs (santé, conso de base, utilities) devant'};
  return {label:'neutre',cls:'',txt:'pas de rotation marquée'};
}

async function callClaude({system,user,max=1800,search=false}){
  const key=CFG.keys().anthropic;
  if(!key) throw new Error('no-key');
  const body={model:CFG.model(),max_tokens:max,system,messages:[{role:'user',content:user}]};
  if(search) body.tools=[{type:'web_search_20250305',name:'web_search',max_uses:5}];
  const r=await fetch('https://api.anthropic.com/v1/messages',{
    method:'POST',
    headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
    body:JSON.stringify(body)
  });
  if(!r.ok){const t=await r.text();throw new Error('API '+r.status+' '+t.slice(0,140))}
  const d=await r.json();
  return d.content.filter(c=>c.type==='text').map(c=>c.text).join('\n').trim();
}
function parseJSON(txt){ // tolère ```json, prose autour, et JSON tronqué
  let c=txt.replace(/```json|```/g,'').trim();
  const a=c.indexOf('['),o=c.indexOf('{');
  let start=(a>=0&&(a<o||o<0))?a:o; if(start<0)start=0;
  c=c.slice(start);
  const isArr=c[0]==='[';
  try{ return JSON.parse(c.slice(0,Math.max(c.lastIndexOf(']'),c.lastIndexOf('}'))+1)); }catch(e){}
  // réparation : JSON tronqué → on coupe après le dernier objet complet et on referme
  const lastObj=c.lastIndexOf('}');
  if(lastObj>0){
    let frag=c.slice(0,lastObj+1);
    if(isArr) frag+=']';
    try{ return JSON.parse(frag); }catch(e){}
  }
  throw new Error('JSON illisible (réponse tronquée)');
}

const BRIEF_SYSTEM=`Tu es analyste sur un desk macro/actions. Tu produis le brief matinal indices pour un trader basé en Europe (Paris).
ENTRÉE : un objet market_state (chiffres déjà calculés, source de vérité).
RÈGLES STRICTES :
- Ne cite QUE des chiffres présents dans market_state. N'en invente aucun.
- Réponds en français, ton de desk : dense, direct, sans bullshit.
- Le brief répond à : dans quelle humeur les marchés ouvrent en Europe, et pourquoi.
- Structure : 1) verdict en une phrase  2) relais overnight (clôture US → Asie → futures)  3) le driver du jour  4) état des internals (régime, VIX, breadth)  5) agenda (macro + earnings)  6) risques.
SORTIE : JSON strict, aucun texte autour :
{"verdict":"...","relais":"...","driver":"...","internals":"...","agenda":"...","risques":"..."}`;

const CATALYST_SYSTEM=`Tu es analyste sur un desk macro/actions. Tu produis le volet catalyseurs du brief matinal indices.
ENTRÉES (dans le message) :
- intel : feed FMP du jour (news, upgrades/downgrades analystes, surprises de résultats avec estimé vs réalisé, M&A, + secteur/pairs des sociétés). C'est ta SOURCE PRIMAIRE.
- market_state : toile de fond chiffrée + regime (risk-on/off) du jour.
- sectors : rotation sectorielle live (quel secteur mène/cale).
- structure : poids indices + graphe pairs + playbook liquidité (complément).
- scope, date.
Les faits et chiffres viennent d'intel ; tu peux ajouter du contexte général mais aucun chiffre hors intel/market_state.
MÉTHODE : écarte le bruit ; ne retiens que ce qui déplace un titre lourd, un secteur ou le sentiment. Pour chaque catalyseur, déroule entité → pairs (intel.entities ou structure) → secteur → indice → liquidité → scénarios. CONTEXTUALISE au tape : précise comment le regime et la rotation du jour amortissent ou amplifient le catalyseur. Classe par conviction. MAXIMUM 4 fiches.
RÈGLES STRICTES :
- surprise : si intel.earnings donne estimé vs réalisé, calcule-la FACTUELLEMENT (réalisé > estimé = surprise positive). Sinon "indéterminé". Ne devine pas.
- N'invente pas de pair/poids absent de intel.entities ou structure → sinon "relation non confirmée".
- Ne cite que des chiffres présents dans les entrées. Aucun chiffre fabriqué.
- horizon : intraday | days | structural. Ne présente jamais une lame de fond comme un catalyseur de séance.
- liquidité : applique le playbook selon le type. Chaque scénario inclut une invalidation. LECTURES et SCÉNARIOS, jamais de recommandation d'achat/vente.
SORTIE : UNIQUEMENT un tableau JSON, aucun texte/markdown/citation autour, rien avant ni après le [ ]. Sois concis (phrases courtes) pour ne pas dépasser. Schéma par fiche :
{"headline","entity","type","surprise","horizon","direct_impact":{},"index_transmission":{},"liquidity","scenarios":{"bull","base","bear","invalidation"},"watch":[],"sources":[],"conviction":1}`;

  SB=sb;

  const sorted=[...sb.sectors].sort((a,b)=>b.chg-a.chg);
  const max=Math.max(...sorted.map(s=>Math.abs(s.chg)),0.5);
  const tile=s=>{const i=Math.min(Math.abs(s.chg)/max,1);const c=s.chg>=0?`rgba(61,214,140,${.12+i*.5})`:`rgba(242,85,90,${.12+i*.5})`;
    return `<div class="card" style="background:${c};padding:12px"><div class="mono" style="font-size:11px;color:var(--mut)">${s.sym}</div>
      <div style="font-size:13px;margin:2px 0">${s.name}</div><div class="mono" style="font-size:18px">${sign(s.chg)}${fmt(s.chg)}%</div></div>`;};
  const rr=riskRotation(sb);
  out.innerHTML=`
   <div class="card" style="margin-bottom:14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap">
     <span class="k">rotation</span>
     <span class="conv mono" style="${rr.cls==='up'?'background:rgba(61,214,140,.15);color:var(--up)':rr.cls==='down'?'background:rgba(242,85,90,.15);color:var(--down)':'background:rgba(255,255,255,.06);color:var(--mut)'}">${rr.label}</span>
     <span style="color:var(--mut);font-size:13px">${rr.txt} · réf. SPY ${sb.spy==null?'—':sign(sb.spy)+fmt(sb.spy)+'%'}</span>
   </div>
   <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">${sorted.map(tile).join('')}</div>
   <p style="color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:10px">offensifs/cycliques devant les défensifs = risk-on · l'inverse = risk-off</p>`;
};

V.breadth=async()=>{
  $('#view').innerHTML=`<div class="h1">marché<b>Breadth <em>/ internals</em></b></div>
   <p class="sub">La participation : une hausse portée par tout le marché est solide ; portée par 5 méga-caps, elle est fragile.</p>
   <div id="brOut"><div class="empty">Chargement des internals…</div></div>`;
  const sb=SB&&!SB.error?SB:await fetchSectorBreadth();
  const out=$('#brOut');
  if(sb.error){ out.innerHTML=proxyError(sb.error); return; }
  SB=sb;
  if(!sb.sectors||!sb.sectors.length){ out.innerHTML='<div class="empty">Données indisponibles (vérifie la clé Twelve Data du proxy).</div>'; return; }
  const green=sb.sectors.filter(s=>s.chg>0).length, tot=sb.sectors.length;
  const v=breadthVerdict(sb);
  const card=(l,val,note)=>`<div class="card"><div class="k">${l}</div>
    <div class="mono" style="font-size:22px;margin:6px 0">${val}</div><div style="color:var(--mut);font-size:12px">${note}</div></div>`;
  const cmp=(a,b)=>(a==null||b==null)?'—':a<b?'en retard':'devant';
  out.innerHTML=`
   <div class="card" style="margin-bottom:14px">
     <div class="row"><span class="k">verdict breadth</span>
       <span class="conv mono" style="${v.cls==='up'?'background:rgba(61,214,140,.15);color:var(--up)':v.cls==='down'?'background:rgba(242,85,90,.15);color:var(--down)':'background:rgba(255,255,255,.06);color:var(--mut)'}">${v.label}</span></div>
     <p style="margin-top:8px">${v.txt}</p></div>
   <div class="grid g3">
     ${card('secteurs en hausse',green+' / '+tot, green>=tot*0.6?'participation large':green<=tot*0.4?'participation étroite':'mitigé')}
     ${card('équipondéré vs capi (RSP/SPY)',sb.rsp==null?'—':sign(sb.rsp)+fmt(sb.rsp)+'%','équipondéré '+cmp(sb.rsp,sb.spy)+' du cap-weight → '+(sb.rsp<sb.spy?'marché étroit':'sain'))}
     ${card('small caps (IWM vs SPY)',sb.iwm==null?'—':sign(sb.iwm)+fmt(sb.iwm)+'%','small caps '+cmp(sb.iwm,sb.spy)+' → appétit pour le risque')}
   </div>
   <p style="color:var(--dim);font-size:11px;font-family:var(--mono);margin-top:10px">RSP = équipondéré · SPY = capi-pondéré · IWM = Russell 2000. New highs/lows & McClellan = v2 (flux dédié).</p>`;
};

V.journal=()=>{
  const items=JSON.parse(CFG.get('journal')||'[]');
  $('#view').innerHTML=`<div class="h1">desk<b>Jour<em>nal</em></b></div>
   <p class="sub">Documente tes positions sur indices : thèse, conviction, résultat. Stocké en local.</p>
   <div class="card"><div class="row">
     <input id="jt" placeholder="ex. Long CAC sur catalyseur Airbus" style="flex:1;min-width:200px;background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:9px 11px;color:var(--tx)">
     <select id="jc" style="background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:9px;color:var(--tx);font-family:var(--mono)"><option>conv 1</option><option>conv 2</option><option selected>conv 3</option><option>conv 4</option><option>conv 5</option></select>
     <button class="btn" id="jadd">+ ajouter</button>
   </div></div>
   <div id="jlist" style="margin-top:14px">${items.map((x,i)=>jrow(x,i)).join('')||'<div class="empty">aucune entrée</div>'}</div>`;
  $('#jadd').onclick=()=>{const t=$('#jt').value.trim();if(!t)return;items.unshift({t,c:$('#jc').value,d:new Date().toLocaleString('fr-FR')});CFG.set('journal',JSON.stringify(items));V.journal();};
};
function jrow(x,i){return `<div class="card" style="display:flex;gap:12px;align-items:center;margin-bottom:8px">
  <span class="conv mono" style="background:rgba(233,178,58,.12);color:var(--gold)">${x.c}</span>
  <div style="flex:1"><div>${x.t}</div><div style="color:var(--dim);font-size:11px;font-family:var(--mono)">${x.d}</div></div></div>`;}

V.settings=()=>{
  const k=CFG.keys();
  const st=v=>v?'<span class="status ok">configuré</span>':'<span class="status no">non configuré</span>';
  $('#view').innerHTML=`<div class="h1">config<b>Para<em>mètres</em></b></div>
   <p class="sub">Les vraies données arrivent via ton proxy FastAPI. Les clés data (FRED, Twelve Data, FMP) vivent côté serveur — pas ici. Seules la clé Anthropic et l'URL du proxy restent dans ton navigateur.</p>
   <div class="section-h"><h3>Proxy de données</h3><span class="ln"></span></div>
   <div class="card"><div class="field"><label>URL du proxy ${st(CFG.get('proxy'))}</label>
     <div class="hint">Ton service FastAPI déployé (ex. Railway/Render). Sans lui, aucune donnée réelle — et aucune donnée factice.</div>
     <input id="proxy" type="text" placeholder="https://apex-proxy.up.railway.app" value="${CFG.get('proxy')||''}"></div>
     <button class="btn ghost" id="ping">Tester la connexion</button> <span id="pingres" class="mono" style="font-size:12px"></span>
   </div>
   <div class="section-h"><h3>IA (brief & catalyseurs)</h3><span class="ln"></span></div>
   <div class="card">
     <div class="field"><label>Clé API Anthropic ${st(k.anthropic)}</label>
       <div class="hint">Brief + catalyseurs. Reste dans ton navigateur. console.anthropic.com/settings/keys</div>
       <input id="k_anthropic" type="password" placeholder="sk-ant-…" value="${k.anthropic||''}"></div>
     <div class="field"><label>Modèle</label>
       <select id="model">
         <option value="claude-sonnet-4-6"${CFG.model()==='claude-sonnet-4-6'?' selected':''}>claude-sonnet-4-6 (rapide, recommandé)</option>
         <option value="claude-opus-4-8"${CFG.model()==='claude-opus-4-8'?' selected':''}>claude-opus-4-8 (le plus puissant)</option>
       </select></div>
   </div>
   <div class="row" style="margin-top:6px"><button class="btn" id="save">Enregistrer</button>
     <button class="btn ghost" id="clear">Tout effacer</button></div>
   <p style="color:var(--dim);font-size:11.5px;margin-top:14px;font-family:var(--mono)">Les clés FRED / Twelve Data / FMP se configurent dans le fichier .env du proxy, jamais ici.</p>`;
  $('#save').onclick=()=>{CFG.set('proxy',$('#proxy').value.trim());CFG.set('k_anthropic',$('#k_anthropic').value.trim());CFG.set('model',$('#model').value);MS=null;SB=null;toast('Enregistré');};
  $('#clear').onclick=()=>{if(confirm('Effacer toutes les clés et données locales ?')){localStorage.clear();MS=null;SB=null;V.settings();}};
  $('#ping').onclick=async()=>{const p=$('#proxy').value.trim().replace(/\/$/,'');const r=$('#pingres');r.textContent='…';
    try{const d=await jget(p+'/api/health');r.innerHTML=`<span class="up">OK</span> · clés serveur : ${Object.entries(d.keys).filter(([,v])=>v).map(([n])=>n).join(', ')||'aucune'}`;}
    catch(e){r.innerHTML='<span class="down">injoignable</span>';}};
};
function toast(m){const t=document.createElement('div');t.textContent=m;t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1407;padding:10px 18px;border-radius:8px;font-weight:600;z-index:99';document.body.appendChild(t);setTimeout(()=>t.remove(),1600);}

/* ---------- regime badge ---------- */
function paintRegimeBadge(s){
  if(!s)return;
  const col=s.regime.score>=1?'var(--up)':s.regime.score<=-1?'var(--down)':'var(--amb)';
  $('#regimeBadge').innerHTML=`<span class="dot" style="background:${col};box-shadow:0 0 8px ${col}"></span><span>régime ${s.regime.risk} ${sign(s.regime.score)}${s.regime.score}</span>`;
}

/* ---------- TradingView ticker ---------- */
function mountTicker(){
  const c=$('#view .tradingview-widget-container'); if(!c)return;
  const s=document.createElement('script');
  s.src='https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js';s.async=true;
  s.innerHTML=JSON.stringify({symbols:[
    {description:'S&P 500',proName:'FOREXCOM:SPXUSD'},{description:'Nasdaq',proName:'NASDAQ:NDX'},
    {description:'CAC 40',proName:'INDEX:CAC40'},{description:'DAX',proName:'XETR:DAX'},
    {description:'Nikkei',proName:'INDEX:NKY'},{description:'VIX',proName:'CBOE:VIX'}],
    colorTheme:'dark',isTransparent:true,displayMode:'compact',locale:'fr'});
  c.appendChild(s);
}

/* ---------- ROUTER + chrome ---------- */
function go(v){
  document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.v===v));
  $('#side').classList.remove('show');$('#scrim').classList.remove('show');
  (V[v]||V.overview)();
  history.replaceState(null,'','#'+v);
}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#menubtn').onclick=()=>{$('#side').classList.toggle('show');$('#scrim').classList.toggle('show')};
$('#scrim').onclick=()=>{$('#side').classList.remove('show');$('#scrim').classList.remove('show')};

function tick(){
  const now=new Date();
  $('#cParis').textContent=now.toLocaleTimeString('fr-FR',{timeZone:'Europe/Paris',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  $('#cUtc').textContent=now.toLocaleTimeString('fr-FR',{timeZone:'UTC',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const h=now.getUTCHours()+now.getUTCMinutes()/60, wd=now.getUTCDay()>0&&now.getUTCDay()<6;
  const ss=[['Asie',wd&&h>=0&&h<6],['Europe',wd&&h>=7&&h<15.5],['US',wd&&h>=14.5&&h<21]];
  $('#sessions').innerHTML=ss.map(s=>`<span class="sess ${s[1]?'open':''}"><span class="d"></span>${s[0]}</span>`).join('');
}
setInterval(tick,1000);tick();

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    // si un nouveau SW est trouvé, on l'active dès qu'il est prêt
    reg.addEventListener('updatefound',()=>{
      const sw=reg.installing;
      if(!sw)return;
      sw.addEventListener('statechange',()=>{
        if(sw.state==='installed' && navigator.serviceWorker.controller){
          sw.postMessage('SKIP_WAITING'); // activer la nouvelle version tout de suite
        }
      });
    });
    // vérifie les mises à jour au lancement et toutes les 30 min
    reg.update();
    setInterval(()=>reg.update(),30*60*1000);
  }).catch(()=>{});
  // quand le nouveau SW prend la main, on recharge une seule fois automatiquement
  let _reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloaded)return; _reloaded=true; location.reload();
  });
}
go((location.hash||'#overview').slice(1));
</script>
